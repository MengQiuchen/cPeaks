name: Smoke test — map2cpeak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install pip dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke test
        run: |
          cd map2cpeak
          mkdir -p ../tests/output
          python main.py \
            --fragment_path ../tests/data/toy_fragments.tsv.gz \
            --output ../tests/output \
            --mode normal

      - name: Upload smoke-test outputs
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-output
          path: tests/output

      - name: Verify outputs
        run: |
          if [[ ! -f tests/output/cell-cpeaks.mtx ]]; then
            echo "❌ Smoke test failed: missing cell-cpeaks.mtx"
            ls -R tests/output
            exit 1
          fi
          echo "✅ Smoke test passed."
