name: Smoke test — map2cpeak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install pip dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify test data present
        run: |
          ls -lh tests || true
          ls -lh tests/data || true
          file tests/data/toy_fragments.tsv.gz || true
          file tests/data/cpeaks_hg38.bed.gz || true

      - name: Run smoke test
        run: |
          chmod +x tests/run_smoke_test.sh
          ./tests/run_smoke_test.sh

      - name: Upload smoke-test outputs
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-output
          path: tests/output
