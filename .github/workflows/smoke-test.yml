name: Smoke test — map2cpeak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: 3.10
          environment-file: environment.yml
          activate-environment: cpeaks
          use-mamba: true

      - name: Prepare test data (already in repo under tests/data)
        run: |
          ls -R tests || true
          # ensure the cpeaks gz is available at repo root (main.py expects it)
          cp tests/data/cpeaks_hg38.bed.gz ./cpeaks_hg38.bed.gz

      - name: Run smoke test
        run: |
          chmod +x tests/run_smoke_test.sh
          ./tests/run_smoke_test.sh

      - name: Upload smoke-test outputs
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-output
          path: tests/output
